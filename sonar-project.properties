sonar.projectKey=pulperia-web
sonar.projectName=Pulpería Web
sonar.projectVersion=0.1.0

sonar.organization=tu-github-username

sonar.sources=src
sonar.tests=__tests__
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.d.ts,**/__tests__/**,**/node_modules/**

sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/__tests__/**,**/coverage/**

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

sonar.qualitygate.wait=true
sonar.login=${SONAR_TOKEN}
sonar.host.url=https://sonarcloud.io
