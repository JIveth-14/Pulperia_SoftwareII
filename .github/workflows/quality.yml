name: Code Quality & Coverage

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    name: Test & Generate Coverage

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck || true

      - name: Run ESLint
        run: npm run lint || true

      - name: Run tests with coverage
        run: |
          set -o pipefail
          npm test -- --coverage --forceExit --detectOpenHandles 2>&1 | tee test-output.log
        continue-on-error: false

      - name: Check test output
        run: |
          echo "Test output:"
          cat test-output.log
          echo ""
          echo "Coverage directory contents:"
          ls -la coverage/ || echo "Coverage directory not found"
          echo ""
          echo "Coverage summary:"
          cat coverage/coverage-summary.json || echo "Coverage summary not found"
        if: always()

      - name: Validate lcov coverage data
        run: |
          test -f coverage/lcov.info
          grep -Eq '^DA:[0-9]+,[1-9][0-9]*$' coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        if: always()

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
        if: github.event_name == 'pull_request'
        continue-on-error: true

      - name: Display coverage summary
        run: |
          echo "📊 Coverage Report Summary:"
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json
          else
            echo "⚠️ Coverage summary not found - tests may not have run"
          fi
          echo ""
          echo "📁 Coverage files:"
          ls -la coverage/ || echo "No coverage directory"
        if: always()

  sonarcloud:
    runs-on: ubuntu-latest
    name: SonarCloud Analysis
    needs: test-and-coverage
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --forceExit --detectOpenHandles
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=JIveth-14_Pulperia_SoftwareII
            -Dsonar.organization=jiveth-14
            -Dsonar.javascript.file.suffixes=.js,.jsx
            -Dsonar.typescript.file.suffixes=.ts,.tsx
        if: env.SONAR_TOKEN != ''
        continue-on-error: true

      - name: SonarCloud Status
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "✅ SonarCloud analysis completed"
            echo "📊 View results: https://sonarcloud.io/projects/JIveth-14_Pulperia_SoftwareII"
          else
            echo "⚠️ SONAR_TOKEN not configured in GitHub Secrets"
            echo "📖 Setup instructions: See SONARCLOUD_SETUP.md"
          fi
        if: always()
