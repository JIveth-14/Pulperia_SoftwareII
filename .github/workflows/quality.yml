name: Code Quality & Coverage

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    name: Test & Generate Coverage

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c7d81f18d3f54b3711d3e44aa2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@60edb5dd545a775178fce8f3e3777f52eca5d26f
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript type check
        run: npm run typecheck || true

      - name: Run ESLint
        run: npm run lint || true

      - name: Run tests with coverage
        run: npm test -- --coverage --passWithNoTests
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5ecb98a3c6b747ed38dc09f393e3c7b1faac3ff2
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: always()

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@41e373fbb660823d61b239a8aaf911f81f165c33
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
        if: github.event_name == 'pull_request'
        continue-on-error: true

      - name: Display coverage summary
        run: |
          echo "📊 Coverage Report Summary:"
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | grep -o '"lines":[^}]*' || echo "Coverage data available"
          else
            echo "✅ Tests completed successfully"
          fi
        if: always()

  sonarcloud:
    runs-on: ubuntu-latest
    name: SonarCloud Analysis
    needs: test-and-coverage
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c7d81f18d3f54b3711d3e44aa2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178fce8f3e3777f52eca5d26f
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm test -- --coverage --passWithNoTests
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@4a3e55b9fc8b54f8d9c79c6f3daeb36d06e0ceaa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=JIveth-14_Pulperia_SoftwareII
            -Dsonar.organization=jiveth-14
        continue-on-error: true

      - name: SonarCloud Status
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "✅ SonarCloud analysis completed"
            echo "📊 View results: https://sonarcloud.io/projects/JIveth-14_Pulperia_SoftwareII"
          else
            echo "⚠️ SONAR_TOKEN not configured in GitHub Secrets"
            echo "📖 Setup instructions: See SONARCLOUD_SETUP.md"
          fi
        if: always()
